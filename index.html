<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">  <title>Tus flores amarillas</title>  <style> *{     box-sizing:border-box;     -webkit-tap-highlight-color:transparent; }  html,body{     margin:0;     width:100%;     height:100%;     overflow:hidden;     background:#000;     touch-action:none; }  body{     font-family:Georgia,"Times New Roman",serif; }  #world{     position:fixed;     inset:0;     overflow:hidden;     background:#000;     isolation:isolate; }  /* =====================================================    CIELO ===================================================== */  .sky{     position:absolute;     inset:0;     opacity:0;      background:         radial-gradient(             circle at 76% 25%,             rgba(255,247,196,.95) 0 3%,             rgba(255,211,117,.45) 9%,             transparent 27%         ),         linear-gradient(             to bottom,             #17283d 0%,             #3e5a70 27%,             #99736b 48%,             #d99b5c 67%,             #614524 100%         );      transition:opacity:4s ease; }  .sun{     position:absolute;     width:clamp(80px,13vw,160px);     aspect-ratio:1;     left:72%;     top:19%;      border-radius:50%;      background:         radial-gradient(             circle,             #fffde4 0 15%,             #ffeaa2 30%,             #ffc65e 52%,             transparent 73%         );      box-shadow:         0 0 45px 15px rgba(255,210,112,.2),         0 0 130px 50px rgba(255,183,76,.15);      animation:sunBreath 7s ease-in-out infinite alternate; }  @keyframes sunBreath{     from{transform:scale(.98)}     to{transform:scale(1.04)} }  /* Nubes atmosféricas */  .cloud{     position:absolute;     width:30vw;     height:7vw;     min-height:25px;     border-radius:50%;     background:rgba(255,224,197,.08);     filter:blur(14px);     opacity:.7;     animation:cloudMove var(--cloudTime) linear infinite; }  @keyframes cloudMove{     from{         transform:translateX(-40vw);     }     to{         transform:translateX(150vw);     } }  /* =====================================================    TERRENO ===================================================== */  .ground{     position:absolute;     left:-10%;     right:-10%;     bottom:-20%;     height:63%;      opacity:0;      transform:         perspective(900px)         rotateX(8deg);      transform-origin:center bottom;      background:         radial-gradient(             ellipse at 50% 0,             rgba(180,143,72,.42),             transparent 45%         ),         repeating-linear-gradient(             88deg,             rgba(35,28,15,.08) 0 2px,             transparent 2px 11px         ),         linear-gradient(             to bottom,             #80683a,             #4b371e 45%,             #21170d         );      box-shadow:         inset 0 25px 55px rgba(255,218,121,.1);      transition:opacity:4s ease; }  /* =====================================================    GOTA INICIAL ===================================================== */  .dropIntro{     position:absolute;     left:50%;     top:28%;      width:7px;     height:18px;      opacity:0;      border-radius:80% 20% 70% 30%;      background:         linear-gradient(             135deg,             #e8f8ff,             #78b8d4         );      filter:         drop-shadow(             0 0 8px rgba(130,210,255,.5)         );      transform:translate(-50%,-200px) rotate(35deg);      z-index:40; }  /* onda */  .ripple{     position:absolute;     left:50%;     top:65%;      width:10px;     height:5px;      border:1px solid rgba(220,230,180,.4);      border-radius:50%;      opacity:0;      transform:translate(-50%,-50%) scale(.1); }  /* =====================================================    SEMILLA ===================================================== */  .seed{     position:absolute;     left:50%;     top:65%;      width:12px;     height:19px;      opacity:0;      border-radius:         70% 35% 70% 35%;      transform:         translate(-50%,-50%)         rotate(38deg)         scale(.1);      background:         radial-gradient(             circle at 35% 22%,             #e3bb70,             #774a1c 65%,             #321d08         );      box-shadow:         0 3px 8px rgba(0,0,0,.8),         inset 2px 1px 2px rgba(255,228,155,.3);      z-index:20; }  /* =====================================================    TALLO ===================================================== */  .growingStem{     position:absolute;      left:50%;     bottom:35%;      width:5px;     height:0;      transform:         translateX(-50%)         rotate(-2deg);      transform-origin:bottom;      border-radius:100%;      background:         linear-gradient(             to right,             #1b2d11,             #8aa052,             #263a16         );      box-shadow:         2px 0 4px rgba(0,0,0,.4);      z-index:12; }  .leaf{     position:absolute;      width:34px;     height:14px;      opacity:0;      border-radius:         100% 0 100% 0;      background:         linear-gradient(             135deg,             #a2b567,             #29451b         );      box-shadow:         inset 2px 2px 3px rgba(255,255,200,.15); }  .leaf1{     left:-30px;     top:43%;     transform:rotate(-25deg) scale(0); }  .leaf2{     left:0;     top:62%;     transform:rotate(205deg) scale(0); }  /* =====================================================    FLOR CENTRAL ===================================================== */  .centralFlower{     position:absolute;      left:50%;     bottom:58%;      width:120px;     height:120px;      opacity:0;      transform:         translate(-50%,50%)         scale(.05);      z-index:15; }  .petals{     position:absolute;     inset:0; }  .petal{     position:absolute;      width:36%;     height:66%;      left:32%;     top:17%;      border-radius:         70% 35% 60% 40%;      transform-origin:50% 84%;      background:         radial-gradient(             circle at 28% 17%,             #fffbc2 0 5%,             transparent 6%         ),         linear-gradient(             145deg,             #fff2a2,             #ffd42b 48%,             #c77c08         );      box-shadow:         inset 3px 4px 6px rgba(255,255,215,.55),         inset -4px -5px 6px rgba(113,59,0,.3); }  .petal:nth-child(1){transform:rotate(0)} .petal:nth-child(2){transform:rotate(45deg)} .petal:nth-child(3){transform:rotate(90deg)} .petal:nth-child(4){transform:rotate(135deg)} .petal:nth-child(5){transform:rotate(180deg)} .petal:nth-child(6){transform:rotate(225deg)} .petal:nth-child(7){transform:rotate(270deg)} .petal:nth-child(8){transform:rotate(315deg)}  .flowerCenter{     position:absolute;      width:28%;     aspect-ratio:1;      left:36%;     top:36%;      border-radius:50%;      background:         repeating-radial-gradient(             circle,             #523108 0 1px,             #a96c12 2px 3px         );      box-shadow:         0 3px 7px rgba(40,20,0,.6),         inset 2px 2px 3px rgba(255,220,100,.3); }  /* =====================================================    CAMPO ===================================================== */  .field{     position:absolute;     inset:0;      opacity:0;      transform:         scale(1.55);      transform-origin:         center 70%;      transition:         opacity:3s ease,         transform:8s cubic-bezier(.18,.72,.22,1);      z-index:5; }  .flower{     position:absolute;      width:var(--size);     height:calc(var(--size)*1.55);      transform:         translate(-50%,-50%)         scale(0);      animation:         flowerBirth 1.3s cubic-bezier(.16,.8,.25,1) forwards,         wind var(--wind) ease-in-out infinite alternate;      animation-delay:         var(--delay),         calc(var(--delay) + 1.3s);      filter:         blur(var(--blur))         drop-shadow(             0 7px 5px rgba(18,10,2,.42)         ); }  .flowerStem{     position:absolute;      width:5%;     height:72%;      left:50%;     bottom:0;      transform:translateX(-50%);      border-radius:100%;      background:         linear-gradient(             to right,             #1d3213,             #7d9847,             #253a17         ); }  .flowerHead{     position:absolute;      width:100%;     aspect-ratio:1; }  .smallPetal{     position:absolute;      width:38%;     height:65%;      left:31%;     top:17%;      border-radius:         65% 35% 60% 40%;      transform-origin:50% 85%;      background:         radial-gradient(             circle at 30% 20%,             #fff8ae 0 6%,             transparent 7%         ),         linear-gradient(             145deg,             #fff0a0,             var(--yellow),             #b8750b         );      box-shadow:         inset 2px 3px 4px rgba(255,255,220,.45),         inset -3px -4px 5px rgba(110,60,0,.25); }  .smallPetal:nth-child(1){transform:rotate(0)} .smallPetal:nth-child(2){transform:rotate(45deg)} .smallPetal:nth-child(3){transform:rotate(90deg)} .smallPetal:nth-child(4){transform:rotate(135deg)} .smallPetal:nth-child(5){transform:rotate(180deg)} .smallPetal:nth-child(6){transform:rotate(225deg)} .smallPetal:nth-child(7){transform:rotate(270deg)} .smallPetal:nth-child(8){transform:rotate(315deg)}  .smallCenter{     position:absolute;      width:27%;     aspect-ratio:1;      left:36.5%;     top:36.5%;      border-radius:50%;      background:         repeating-radial-gradient(             circle,             #583509 0 1px,             #a96c12 2px 3px         ); }  /* =====================================================    VIENTO ===================================================== */  @keyframes wind{     from{         rotate:-2deg;     }      to{         rotate:3deg;     } }  @keyframes flowerBirth{     0%{         transform:             translate(-50%,-50%)             scale(0)             rotate(-12deg);          opacity:0;     }      65%{         transform:             translate(-50%,-50%)             scale(1.12)             rotate(4deg);          opacity:1;     }      100%{         transform:             translate(-50%,-50%)             scale(1)             rotate(0);          opacity:1;     } }  /* =====================================================    CORAZÓN ===================================================== */  .heart{     position:absolute;     inset:0;      opacity:0;      pointer-events:none;      z-index:50; }  /* =====================================================    PARTÍCULAS ===================================================== */  .particle{     position:absolute;      width:var(--size);     height:var(--size);      border-radius:50%;      background:#fff0a4;      box-shadow:         0 0 9px rgba(255,218,91,.85);      pointer-events:none;      animation:         particleFloat         var(--duration)         cubic-bezier(.2,.7,.3,1)         forwards; }  @keyframes particleFloat{     0%{         transform:             translate(0,0)             scale(.1);          opacity:0;     }      15%{         opacity:.9;     }      100%{         transform:             translate(var(--x),var(--y))             scale(1);          opacity:0;     } }  /* =====================================================    MISTERIO / BRILLO ===================================================== */  .glow{     position:absolute;     left:50%;     top:65%;      width:30px;     height:30px;      border-radius:50%;      opacity:0;      transform:         translate(-50%,-50%)         scale(.1);      background:         radial-gradient(             circle,             rgba(255,249,187,.9),             rgba(255,204,73,.3) 40%,             transparent 70%         );      box-shadow:         0 0 50px 20px rgba(255,207,78,.15);      z-index:14; }  /* =====================================================    MENSAJE ===================================================== */  .final{     position:absolute;     inset:0;      display:flex;     align-items:center;     justify-content:center;     flex-direction:column;      opacity:0;      transform:scale(.9);      background:         radial-gradient(             circle at center,             rgba(32,20,5,.02),             rgba(0,0,0,.48)         );      z-index:100;      pointer-events:none;      transition:         opacity:3s ease,         transform:3s cubic-bezier(.18,.8,.2,1); }  .final h1{     margin:0;     padding:20px;      color:#fff3b5;      font-size:         clamp(38px,9vw,105px);      font-weight:400;      line-height:1.05;      text-align:center;      text-shadow:         0 2px 8px rgba(0,0,0,.8),         0 0 35px rgba(255,209,85,.25); }  .final p{     margin:10px 0 0;      color:         rgba(255,239,187,.85);      font-size:         clamp(11px,2vw,18px);      letter-spacing:         .38em;      text-transform:uppercase; }  /* =====================================================    TEXTO INICIAL ===================================================== */  .start{     position:absolute;     inset:0;      display:flex;     align-items:center;     justify-content:center;      color:         rgba(255,255,255,.7);      font-size:12px;      letter-spacing:.35em;      text-transform:uppercase;      z-index:150;      pointer-events:none;      transition:opacity 1.5s ease; }  /* =====================================================    GRANO ===================================================== */  .grain{     position:absolute;     inset:-50%;      opacity:.045;      pointer-events:none;      z-index:300;      background:         repeating-radial-gradient(             circle at 20% 30%,             #fff 0 1px,             transparent 1px 4px         );      background-size:7px 7px;      animation:         grain .25s steps(2) infinite;      mix-blend-mode:soft-light; }  @keyframes grain{     0%{transform:translate(0,0)}     25%{transform:translate(2%,-1%)}     50%{transform:translate(-1%,2%)}     75%{transform:translate(1%,1%)}     100%{transform:translate(-2%,-2%)} } </style> </head>  <body>  <div id="world">      <div class="sky">         <div class="sun"></div>          <div             class="cloud"             style="top:16%;--cloudTime:65s">         </div>          <div             class="cloud"             style="top:31%;transform:scale(.7);--cloudTime:82s">         </div>     </div>      <div class="ground"></div>      <div class="dropIntro" id="introDrop"></div>      <div class="ripple" id="ripple"></div>      <div class="seed" id="seed"></div>      <div class="glow" id="glow"></div>      <div class="growingStem" id="stem">         <div class="leaf leaf1"></div>         <div class="leaf leaf2"></div>     </div>      <div class="centralFlower" id="centralFlower">         <div class="petals"></div>         <div class="flowerCenter"></div>     </div>      <div class="field" id="field"></div>      <div class="heart" id="heart"></div>      <div class="final" id="final">         <h1>Tus flores amarillas</h1>         <p>porque algunas cosas bonitas merecen florecer</p>     </div>      <div class="start" id="start">         toca para comenzar     </div>      <div class="grain"></div>  </div>  <script> const world=document.getElementById("world"); const sky=document.querySelector(".sky"); const ground=document.querySelector(".ground"); const introDrop=document.getElementById("introDrop"); const ripple=document.getElementById("ripple"); const seed=document.getElementById("seed"); const glow=document.getElementById("glow"); const stem=document.getElementById("stem"); const centralFlower=document.getElementById("centralFlower"); const field=document.getElementById("field"); const heart=document.getElementById("heart"); const finalScreen=document.getElementById("final"); const start=document.getElementById("start");  let running=false;  const sleep=ms=>     new Promise(resolve=>setTimeout(resolve,ms));  const random=(min,max)=>     Math.random()*(max-min)+min;   /* =====================================================    FLOR ===================================================== */  function createFlower(x,y,depth=1,parent=field){      const flower=document.createElement("div");      flower.className="flower";      const size=         random(18,46)*depth;      flower.style.left=x+"px";     flower.style.top=y+"px";      flower.style.setProperty(         "--size",         size+"px"     );      flower.style.setProperty(         "--yellow",         hsl(             ${random(42,50)},             ${random(82,100)}%,             ${random(43,63)}%         )    );      flower.style.setProperty(         "--delay",         random(0,.8)+"s"     );      flower.style.setProperty(         "--wind",         random(2.8,6)+"s"     );      flower.style.setProperty(         "--blur",         Math.max(             0,             (1-depth)*2.2         )+"px"     );      const stem=document.createElement("div");      stem.className="flowerStem";      const head=document.createElement("div");      head.className="flowerHead";      for(let i=0;i<8;i++){          const petal=             document.createElement("div");          petal.className="smallPetal";          head.appendChild(petal);     }      const center=         document.createElement("div");      center.className="smallCenter";      head.appendChild(center);      flower.append(stem,head);      parent.appendChild(flower);      return flower; }   /* =====================================================    CAMPO ===================================================== */  function createField(){      const amount=         Math.min(             150,             Math.floor(                 innerWidth*innerHeight/7000             )         );      const horizon=         innerHeight*.57;      for(let i=0;i<amount;i++){          const depth=Math.random();          const x=             random(                 -40,                 innerWidth+40             );          const y=             horizon+             Math.pow(depth,1.55)*             innerHeight*.43;          createFlower(             x,             y,             .3+depth*1.1         );     } }   /* =====================================================    CORAZÓN MATEMÁTICO ===================================================== */  function heartPosition(t){      return{         x:             16*             Math.pow(                 Math.sin(t),                 3             ),          y:             13*Math.cos(t)             -5*Math.cos(2*t)             -2*Math.cos(3*t)             -Math.cos(4*t)     }; }  function createHeart(){      const cx=         innerWidth/2;      const cy=         innerHeight*.53;      const scale=         Math.min(             innerWidth*.017,             innerHeight*.015         );      const amount=90;      for(let i=0;i<amount;i++){          const t=             Math.PI*2*i/amount;          const p=             heartPosition(t);          const x=             cx+p.x*scale;          const y=             cy-p.y*scale;          const flower=             createFlower(                 x,                 y,                 random(.75,1.15),                 heart             );          flower.style.setProperty(             "--delay",             i*.035+             random(0,.4)+"s"         );          flower.style.zIndex=             100+i;     } }   /* =====================================================    PARTÍCULAS ===================================================== */  function particle(x,y){      const p=         document.createElement("div");      p.className="particle";      p.style.left=x+"px";     p.style.top=y+"px";      p.style.setProperty(         "--size",         random(1,4)+"px"     );      p.style.setProperty(         "--x",         random(-90,90)+"px"     );      p.style.setProperty(         "--y",         random(-130,20)+"px"     );      p.style.setProperty(         "--duration",         random(.8,1.8)+"s"     );      world.appendChild(p);      setTimeout(         ()=>p.remove(),         2000     ); }   /* =====================================================    TOQUE DURANTE LA EXP
