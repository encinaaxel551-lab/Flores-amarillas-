<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tus flores amarillas</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Georgia, "Times New Roman", serif;
  background:#07111d;
  touch-action:manipulation;
}

#scene{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    linear-gradient(
      to bottom,
      #071a31 0%,
      #12385b 42%,
      #416b68 70%,
      #182d20 100%
    );
}

/* Cielo */

.sky-glow{
  position:absolute;
  width:100%;
  height:55%;
  left:0;
  top:0;
  background:radial-gradient(
    circle at 50% 65%,
    rgba(255,221,112,.35),
    transparent 55%
  );
  opacity:0;
  transition:opacity 3s;
}

.sun{
  position:absolute;
  width:75px;
  height:75px;
  border-radius:50%;
  top:13%;
  right:13%;
  background:#ffd86a;
  box-shadow:
    0 0 25px #ffd86a,
    0 0 70px rgba(255,216,106,.45);
  opacity:.85;
}

/* Estrellas */

.stars{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:white;
  opacity:.7;
  animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
  from{opacity:.2;transform:scale(.7)}
  to{opacity:1;transform:scale(1.5)}
}

/* Suelo */

.ground{
  position:absolute;
  bottom:0;
  left:-5%;
  width:110%;
  height:32%;
  background:
    radial-gradient(ellipse at center,#294d2c 0%,#122b1b 70%);
  border-radius:50% 50% 0 0;
}

/* Flores del campo */

.field{
  position:absolute;
  inset:0;
  pointer-events:none;
  transition:opacity 2s, transform 2s;
}

.field.flowerFade{
  opacity:0;
  transform:translateY(40px);
}

.flower{
  position:absolute;
  width:35px;
  height:100px;
  transform-origin:bottom center;
  animation:sway 3s ease-in-out infinite alternate;
}

.stem{
  position:absolute;
  width:3px;
  height:75px;
  left:16px;
  bottom:0;
  background:linear-gradient(#6ca54d,#245c32);
  border-radius:3px;
}

.leaf{
  position:absolute;
  width:23px;
  height:10px;
  background:#4d8e42;
  border-radius:100% 0 100% 0;
}

.leaf.left{
  left:-2px;
  bottom:30px;
  transform:rotate(-28deg);
}

.leaf.right{
  left:15px;
  bottom:45px;
  transform:scaleX(-1) rotate(-28deg);
}

.head{
  position:absolute;
  width:34px;
  height:34px;
  top:0;
  left:0;
}

.petal{
  position:absolute;
  width:17px;
  height:24px;
  background:#ffd21f;
  border-radius:50%;
  left:8px;
  top:5px;
  transform-origin:50% 80%;
  box-shadow:0 0 5px rgba(255,211,35,.6);
}

.p1{transform:rotate(0deg) translateY(-7px)}
.p2{transform:rotate(45deg) translateY(-7px)}
.p3{transform:rotate(90deg) translateY(-7px)}
.p4{transform:rotate(135deg) translateY(-7px)}
.p5{transform:rotate(180deg) translateY(-7px)}
.p6{transform:rotate(225deg) translateY(-7px)}
.p7{transform:rotate(270deg) translateY(-7px)}
.p8{transform:rotate(315deg) translateY(-7px)}

.center{
  position:absolute;
  width:13px;
  height:13px;
  border-radius:50%;
  background:#8a4d16;
  left:11px;
  top:11px;
  z-index:2;
}

/* Mensaje inicial */

.start{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:rgba(3,12,22,.25);
  backdrop-filter:blur(3px);
  transition:opacity 1.2s, visibility 1.2s;
}

.start.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.start h1{
  color:#ffe36a;
  font-size:clamp(34px,10vw,62px);
  font-weight:normal;
  text-shadow:0 0 20px rgba(255,220,70,.5);
}

.start p{
  margin-top:15px;
  color:#fff;
  font-size:16px;
  opacity:.85;
  animation:pulse 1.8s infinite;
}

@keyframes pulse{
  50%{opacity:.4}
}

/* Partículas */

.particle{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#ffe66d;
  pointer-events:none;
  animation:particle 1.3s ease-out forwards;
  z-index:20;
}

@keyframes particle{
  to{
    transform:translate(
      var(--x),
      var(--y)
    ) scale(0);
    opacity:0;
  }
}

/* RAMO FINAL */

.bouquet{
  position:absolute;
  width:300px;
  height:430px;
  left:50%;
  bottom:3%;
  transform:translateX(-50%) translateY(120%);
  opacity:0;
  z-index:30;
  transition:
    transform 2.8s cubic-bezier(.2,.8,.2,1),
    opacity 2s;
  pointer-events:none;
}

.bouquet.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

.bouquet-glow{
  position:absolute;
  width:250px;
  height:250px;
  left:25px;
  top:25px;
  border-radius:50%;
  background:rgba(255,220,80,.13);
  filter:blur(25px);
}

/* Tallos */

.b-stem{
  position:absolute;
  width:6px;
  height:260px;
  left:147px;
  bottom:42px;
  transform-origin:bottom center;
  border-radius:8px;
  background:linear-gradient(
    to right,
    #285b30,
    #68a94d,
    #24552d
  );
}

.b-stem.s1{transform:rotate(-25deg)}
.b-stem.s2{transform:rotate(-14deg)}
.b-stem.s3{transform:rotate(-5deg)}
.b-stem.s4{transform:rotate(7deg)}
.b-stem.s5{transform:rotate(17deg)}
.b-stem.s6{transform:rotate(28deg)}

/* Hojas del ramo */

.b-leaf{
  position:absolute;
  width:65px;
  height:25px;
  background:#4c8d3f;
  border-radius:100% 0 100% 0;
  transform-origin:right center;
}

.b-leaf.l1{
  left:85px;
  bottom:125px;
  transform:rotate(-24deg);
}

.b-leaf.l2{
  left:155px;
  bottom:150px;
  transform:scaleX(-1) rotate(-24deg);
}

.b-leaf.l3{
  left:102px;
  bottom:90px;
  transform:rotate(-12deg);
}

.b-leaf.l4{
  left:145px;
  bottom:105px;
  transform:scaleX(-1) rotate(-15deg);
}

/* Flores grandes */

.b-flower{
  position:absolute;
  width:86px;
  height:86px;
  transform-origin:center;
  animation:bSway 4s ease-in-out infinite alternate;
}

.b-flower .petal{
  width:42px;
  height:57px;
  left:22px;
  top:15px;
  background:#ffd51e;
  box-shadow:0 0 12px rgba(255,214,35,.55);
}

.b-flower .center{
  width:28px;
  height:28px;
  left:29px;
  top:29px;
  background:#925015;
  box-shadow:0 0 8px rgba(120,65,10,.5);
}

.bf1{left:25px;top:95px;transform:scale(.82)}
.bf2{left:72px;top:55px;transform:scale(.95)}
.bf3{left:112px;top:92px;transform:scale(1.08)}
.bf4{left:162px;top:57px;transform:scale(.94)}
.bf5{left:202px;top:105px;transform:scale(.78)}
.bf6{left:88px;top:15px;transform:scale(.75)}

@keyframes bSway{
  from{margin-top:-3px}
  to{margin-top:4px}
}

/* Papel del ramo */

.wrap{
  position:absolute;
  width:190px;
  height:150px;
  left:55px;
  bottom:5px;
  background:
    linear-gradient(
      145deg,
      #d9b982,
      #f0d7a5 45%,
      #c7a26a
    );
  clip-path:polygon(
    8% 0,
    92% 0,
    100% 100%,
    50% 70%,
    0 100%
  );
  filter:drop-shadow(0 10px 8px rgba(0,0,0,.3));
  z-index:10;
}

.ribbon{
  position:absolute;
  width:100px;
  height:28px;
  left:100px;
  bottom:70px;
  border-radius:5px;
  background:#d8b13c;
  transform:rotate(-5deg);
  box-shadow:0 2px 5px rgba(0,0,0,.2);
  z-index:15;
}

.ribbon:before,
.ribbon:after{
  content:"";
  position:absolute;
  width:52px;
  height:45px;
  top:4px;
  background:#d8b13c;
  z-index:-1;
}

.ribbon:before{
  right:65px;
  border-radius:50% 0 50% 50%;
  transform:rotate(28deg);
}

.ribbon:after{
  left:65px;
  border-radius:0 50% 50% 50%;
  transform:rotate(-28deg);
}

/* Texto final */

.final-message{
  position:absolute;
  z-index:45;
  left:0;
  width:100%;
  bottom:4%;
  text-align:center;
  opacity:0;
  transform:translateY(25px);
  transition:
    opacity 2s 2.5s,
    transform 2s 2.5s;
  pointer-events:none;
}

.final-message.show{
  opacity:1;
  transform:translateY(0);
}

.final-message h2{
  color:#ffe36a;
  font-size:clamp(30px,9vw,52px);
  font-weight:normal;
  text-shadow:
    0 0 8px rgba(255,220,80,.7),
    0 2px 8px rgba(0,0,0,.6);
}

.final-message p{
  color:white;
  margin-top:8px;
  font-size:15px;
  opacity:.85;
}

/* Botón reiniciar */

.reset{
  position:absolute;
  z-index:60;
  right:15px;
  top:15px;
  padding:9px 14px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:20px;
  color:white;
  background:rgba(0,0,0,.25);
  backdrop-filter:blur(5px);
  opacity:0;
  pointer-events:none;
  transition:opacity 1s;
}

.reset.show{
  opacity:1;
  pointer-events:auto;
}

/* Móvil */

@media(max-height:650px){
  .bouquet{
    bottom:-8%;
    transform:translateX(-50%) translateY(120%) scale(.82);
  }

  .bouquet.show{
    transform:translateX(-50%) translateY(0) scale(.82);
  }

  .final-message{
    bottom:1%;
  }
}
</style>
</head>

<body>

<div id="scene">

  <div class="sky-glow" id="skyGlow"></div>
  <div class="sun"></div>
  <div class="stars" id="stars"></div>
  <div class="ground"></div>

  <div class="field" id="field"></div>

  <div class="start" id="start">
    <h1>Flores amarillas</h1>
    <p>Toca la pantalla para comenzar</p>
  </div>

  <!-- RAMO -->

  <div class="bouquet" id="bouquet">

    <div class="bouquet-glow"></div>

    <div class="b-stem s1"></div>
    <div class="b-stem s2"></div>
    <div class="b-stem s3"></div>
    <div class="b-stem s4"></div>
    <div class="b-stem s5"></div>
    <div class="b-stem s6"></div>

    <div class="b-leaf l1"></div>
    <div class="b-leaf l2"></div>
    <div class="b-leaf l3"></div>
    <div class="b-leaf l4"></div>

    <div class="b-flower bf1">
      <div class="petal p1"></div><div class="petal p2"></div>
      <div class="petal p3"></div><div class="petal p4"></div>
      <div class="petal p5"></div><div class="petal p6"></div>
      <div class="petal p7"></div><div class="petal p8"></div>
      <div class="center"></div>
    </div>

    <div class="b-flower bf2">
      <div class="petal p1"></div><div class="petal p2"></div>
      <div class="petal p3"></div><div class="petal p4"></div>
      <div class="petal p5"></div><div class="petal p6"></div>
      <div class="petal p7"></div><div class="petal p8"></div>
      <div class="center"></div>
    </div>

    <div class="b-flower bf3">
      <div class="petal p1"></div><div class="petal p2"></div>
      <div class="petal p3"></div><div class="petal p4"></div>
      <div class="petal p5"></div><div class="petal p6"></div>
      <div class="petal p7"></div><div class="petal p8"></div>
      <div class="center"></div>
    </div>

    <div class="b-flower bf4">
      <div class="petal p1"></div><div class="petal p2"></div>
      <div class="petal p3"></div><div class="petal p4"></div>
      <div class="petal p5"></div><div class="petal p6"></div>
      <div class="petal p7"></div><div class="petal p8"></div>
      <div class="center"></div>
    </div>

    <div class="b-flower bf5">
      <div class="petal p1"></div><div class="petal p2"></div>
      <div class="petal p3"></div><div class="petal p4"></div>
      <div class="petal p5"></div><div class="petal p6"></div>
      <div class="petal p7"></div><div class="petal p8"></div>
      <div class="center"></div>
    </div>

    <div class="b-flower bf6">
      <div class="petal p1"></div><div class="petal p2"></div>
      <div class="petal p3"></div><div class="petal p4"></div>
      <div class="petal p5"></div><div class="petal p6"></div>
      <div class="petal p7"></div><div class="petal p8"></div>
      <div class="center"></div>
    </div>

    <div class="wrap"></div>
    <div class="ribbon"></div>

  </div>

  <div class="final-message" id="finalMessage">
    <h2>Tus flores amarillas</h2>
    <p>Hechas especialmente para ti.</p>
  </div>

  <button class="reset" id="reset">Repetir</button>

</div>

<script>
const scene = document.getElementById("scene");
const start = document.getElementById("start");
const field = document.getElementById("field");
const bouquet = document.getElementById("bouquet");
const finalMessage = document.getElementById("finalMessage");
const reset = document.getElementById("reset");
const skyGlow = document.getElementById("skyGlow");

let started = false;
let taps = 0;
let finished = false;

/* Estrellas */

function createStars(){
  const stars = document.getElementById("stars");

  for(let i=0;i<65;i++){
    const star = document.createElement("div");
    star.className = "star";

    star.style.left = Math.random()*100 + "%";
    star.style.top = Math.random()*55 + "%";
    star.style.animationDelay = Math.random()*3 + "s";

    stars.appendChild(star);
  }
}

/* Crear una flor pequeña */

function createFlower(x,y,scale=1){

  const flower = document.createElement("div");
  flower.className = "flower";

  flower.style.left = (x-18) + "px";
  flower.style.top = (y-100) + "px";
  flower.style.transform = `scale(${scale})`;

  flower.innerHTML = `
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>

    <div class="head">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p6"></div>
      <div class="petal p7"></div>
      <div class="petal p8"></div>
      <div class="center"></div>
    </div>
  `;

  field.appendChild(flower);

  return flower;
}

/* Partículas */

function particles(x,y){

  for(let i=0;i<12;i++){

    const p = document.createElement("div");
    p.className = "particle";

    p.style.left = x + "px";
    p.style.top = y + "px";

    p.style.setProperty(
      "--x",
      ((Math.random()-.5)*130) + "px"
    );

    p.style.setProperty(
      "--y",
      ((Math.random()-.5)*130) + "px"
    );

    scene.appendChild(p);

    setTimeout(()=>{
      p.remove();
    },1400);
  }
}

/* Comenzar */

function begin(){

  if(started) return;

  started = true;

  start.classList.add("hidden");

  skyGlow.style.opacity = "1";

  /* Primeras flores automáticas */

  setTimeout(()=>{
    for(let i=0;i<7;i++){

      const x =
        20 +
        Math.random() *
        (window.innerWidth-40);

      const y =
        window.innerHeight -
        20 -
        Math.random()*100;

      createFlower(
        x,
        y,
        .65 + Math.random()*.45
      );
    }
  },500);
}

/* Toques */

scene.addEventListener("pointerdown",(event)=>{

  if(finished) return;

  if(!started){
    begin();
    return;
  }

  if(event.target.closest(".reset")) return;

  taps++;

  const x = event.clientX;
  const y = event.clientY;

  particles(x,y);

  /*
    Cada toque hace aparecer
    una nueva flor.
  */

  if(taps < 13){

    const flower = createFlower(
      x,
      Math.min(
        y,
        window.innerHeight-30
      ),
      .65 + Math.random()*.45
    );

    flower.animate(
      [
        {
          opacity:0,
          transform:"scale(.2) translateY(30px)"
        },
        {
          opacity:1,
          transform:`scale(${.65 + Math.random()*.45})`
        }
      ],
      {
        duration:800,
        easing:"cubic-bezier(.2,.8,.2,1)"
      }
    );
  }

  /*
    Después de suficientes toques
    comienza automáticamente el final.
  */

  if(taps >= 13){

    finished = true;

    setTimeout(formBouquet,900);
  }
});

/* Formar el ramo */

function formBouquet(){

  /*
    Primero desaparece el campo.
  */

  field.classList.add("flowerFade");

  /*
    Las partículas dan la sensación
    de que las flores se reúnen.
  */

  for(let i=0;i<35;i++){

    setTimeout(()=>{

      const x =
        window.innerWidth/2 +
        (Math.random()-.5)*220;

      const y =
        window.innerHeight*.65 +
        (Math.random()-.5)*250;

      particles(x,y);

    },i*35);
  }

  /*
    Aparece el ramo.
  */

  setTimeout(()=>{

    bouquet.classList.add("show");

  },900);

  /*
    Finalmente aparece el mensaje.
  */

  setTimeout(()=>{

    finalMessage.classList.add("show");
    reset.classList.add("show");

  },3000);
}

/* Reiniciar */

reset.addEventListener("pointerdown",(event)=>{

  event.stopPropagation();

  location.reload();

});

createStars();
</script>

</body>
  </html>
